version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Held back on purpose: newer versions fail to deploy on Mule 4.9.7.
      # See the comment on http.connector.version in pom.xml.
      - dependency-name: "org.mule.connectors:mule-http-connector"
    groups:
      maven-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
